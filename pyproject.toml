[project]
name = "python-correlation-capitalization"
version = "0.2.0"
description = "Analyse de corrélation RSI entre les cryptos à faible capitalisation et BTC, en architecture événementielle."
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--tb=short"]
timeout = 60
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = [".pre-commit-hooks"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "PIE",     # flake8-pie
    "RET",     # flake8-return
    "RUF",     # ruff
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # French text uses typographic characters on purpose
]

[tool.ruff.lint.isort]
# Matches the existing layout: "# noinspection" comments sit right above third-party imports.
lines-between-types = 0
known-first-party = ["agents", "analysis_job", "configuration", "crypto_analyzer", "events", "logger", "serialization"]
